name: CodeQL
# It runs CodeQL static analysis and uploads results to GitHub code scanning.

permissions: read-all

on:
  workflow_dispatch:
  schedule:
    # Run every day at 22:00 UTC
    - cron: '0 22 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_REPO: https://github.com/ispc/ispc.dependencies

jobs:
  analyze:
    name: CodeQL (C/C++)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    # Disabling this workflow for non ispc/ispc repo.
    if: github.repository == 'ispc/ispc'
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Clone the git repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          .github/workflows/scripts/install-build-deps.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality

      # Examples, tests and benchmarks are disabled to keep third-party code
      # (e.g. googletest) out of the analysis.
      - name: Build ISPC
        run: |
          .github/workflows/scripts/build-ispc.sh -DISPC_INCLUDE_BENCHMARKS=OFF -DISPC_INCLUDE_EXAMPLES=OFF \
            -DISPC_INCLUDE_TESTS=OFF -DISPCRT_BUILD_TESTS=OFF

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:c-cpp"
          output: ../results
          upload: never

      # Keep only alerts in ISPC sources under src/ that are error-level or have
      # a high or critical security severity (7.0 or above). This drops other
      # warnings and notes, and alerts in LLVM headers, generated files and other
      # third-party code. paths-ignore can't be used for this, because it doesn't
      # apply to C/C++ built in manual mode. CodeQL usually doesn't set a level on
      # each result, so it is taken from the rule's default configuration.
      - name: Filter CodeQL results
        run: |
          for f in ../results/*.sarif; do
            jq '.runs |= map(
                  ([(.tool.driver.rules // [])[], (.tool.extensions // [])[].rules[]?]
                   | map({key: .id, value: {
                       level: (.defaultConfiguration.level // "warning"),
                       severity: ((.properties["security-severity"] // "0") | tonumber? // 0)}})
                   | from_entries) as $rules
                  | .results |= map(select(
                      (((.locations // [])[0].physicalLocation.artifactLocation.uri // "") | startswith("src/"))
                      and (((.level // $rules[.ruleId].level // "warning") == "error")
                           or (($rules[.ruleId].severity // 0) >= 7.0)))))' \
              "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ../results
          category: "/language:c-cpp"

      - name: Generate Security Report
        uses: rsdmike/github-security-report-action@a3d8cc051bc89f1b622d396adab901aa73857a29 # v4.1.0
        with:
          template: report
          token: ${{ secrets.SECURITY_TOKEN }}

      - name: GitHub Upload Release Artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: report
          path: |
            ./report.pdf
