name: Claude Code

# To ask for a review of a fork PR, write "@claude review" as a top-level PR
# comment: review and review-comment events from forks run without secrets.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # The action only looks for @claude in the issue body and title when the
  # issue is opened; on "assigned" it needs assignee_trigger.
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt for Claude"
        required: true
        type: string
      build:
        description: "Install LLVM and the build dependencies"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      prompt:
        description: "Prompt for Claude"
        required: true
        type: string
      build:
        description: "Install LLVM and the build dependencies"
        required: false
        type: boolean
        default: true
    secrets:
      AWS_REGION:
        required: true
      AWS_BEARER_TOKEN_BEDROCK:
        required: true

permissions: {}

env:
  LLVM_VERSION: "23.1"
  LLVM_TAR: llvm-23.1.2-ubuntu22.04-Release+Asserts-x86.arm.wasm.tar.xz
  LLVM_REPO: https://github.com/ispc/ispc.dependencies

jobs:
  claude:
    # Only run in the main ispc/ispc repo where the secret is available.
    if: |
      github.repository == 'ispc/ispc' &&
      (github.event_name == 'workflow_dispatch' ||
      inputs.prompt != '' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        (github.event.review.author_association == 'OWNER' || github.event.review.author_association == 'MEMBER' || github.event.review.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        (github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER' || github.event.issue.author_association == 'COLLABORATOR')))
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # One session per issue or PR at a time, so two requests don't race on
    # the same branch; prompt runs group by prompt, which names the issue.
    # queue: max keeps every waiting request.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number || inputs.prompt || github.run_id }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write # Required to push branches and create commits
      pull-requests: write
      issues: write
      actions: read # Required for Claude to read CI results on PRs
      id-token: write # Exchanged for a claude[bot] token
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Code from a fork PR is untrusted: Claude may read and review it, but
      # not edit, build, run or push it. Even read-only git commands can run
      # or write things (`git -c alias.x='!cmd' x`, `git log --output=...`),
      # so fork sessions get no Bash at all and read the diff from a file.
      # Deny rules also override the allow rules in .claude/settings.json.
      #
      # Building LLVM + ISPC adds ~2-5 min and ~500MB to the run. Only do it for
      # tasks that actually need to compile: a request mentioning "fix" (e.g.
      # "@claude fix this", "@claude can you fix X"), or a prompt run with
      # "build" set (the default for workflow_call). Lightweight tasks
      # (Q&A, code review) skip the build entirely.
      - name: Determine if build is needed
        id: build_check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROMPT: ${{ inputs.prompt }}
          INPUT_BUILD: ${{ inputs.build }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          IS_PR: ${{ (github.event.issue.pull_request || github.event.pull_request) && 'true' || 'false' }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          fork=false
          if [ "$IS_PR" = true ]; then
            cross=$(gh pr view "$PR_NUMBER" --json isCrossRepository --jq .isCrossRepository)
            # Anything but an explicit "false" counts as a fork.
            [ "$cross" = false ] || fork=true
          fi
          # The text that invoked Claude. Prompt runs (workflow_dispatch and
          # workflow_call) decide with the build input instead; in a called
          # workflow, EVENT_NAME is the caller's event.
          case "$EVENT_NAME" in
            issue_comment|pull_request_review_comment) text=$COMMENT_BODY ;;
            pull_request_review) text=$REVIEW_BODY ;;
            issues) text=$(printf '%s\n%s' "$ISSUE_TITLE" "$ISSUE_BODY") ;;
            *) text= ;;
          esac
          needed=false
          triggered=false
          if [ -n "$INPUT_PROMPT" ]; then
            triggered=true
            if [ "$INPUT_BUILD" = true ]; then needed=true; fi
          else
            # The action's own trigger rule is stricter than the job's if: it
            # wants "@claude" followed by a space, punctuation or the end.
            if printf '%s\n' "$text" | grep -qiE '(^|[[:space:]])@claude([[:space:].,!?;:]|$)'; then
              triggered=true
            fi
            # A mention of "fix" in the invoking text means a build task
            # rather than Q&A/review.
            if printf '%s\n' "$text" | grep -qiE '\bfix(es|ed|ing)?\b'; then
              needed=true
            fi
          fi
          if [ "$fork" = true ]; then
            needed=false
            mkdir -p "$RUNNER_TEMP/pr"
            gh pr diff "$PR_NUMBER" > "$RUNNER_TEMP/pr/pr.diff"
            # The action itself allows git add/commit/rm and its push wrapper;
            # denying Bash removes them too. The action writes its token into
            # .git/config, so Read, Grep and Glob are denied there.
            args='--permission-mode default'
            args+=" --add-dir $RUNNER_TEMP/pr"
            args+=' --allowedTools "Glob,Grep,LS,Read,mcp__github_inline_comment__create_inline_comment"'
            args+=' --disallowedTools "Bash,Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch,Read(./.git/**)"'
            args+=" --append-system-prompt \"This PR comes from a fork, so you can only read and review it. Its diff is in $RUNNER_TEMP/pr/pr.diff. For a review, follow .claude/agents/code-review.md, skipping any step that needs Bash, read the changed code in the checkout, check CI with the mcp__github_ci tools and post specific findings as inline comments. If asked to change, build or test it, reply that a maintainer must push the branch to ispc/ispc first.\""
          else
            # Bash(git *) can still run any program through an alias, so the
            # deny list is defense in depth; the env scrub protects the secrets.
            args='--permission-mode acceptEdits --add-dir /tmp'
            args+=' --allowedTools "Edit,Glob,Grep,LS,Read,Write,Bash(git *),Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr list *),Bash(gh issue view *),Bash(gh run view *),Bash(gh run list *),Bash(gh run download *),Bash(cmake *),Bash(*cmake *),Bash(clang-format *),Bash(*/ispc *),Bash(./build/*),Bash(build/*),Bash(*run_tests.py *),Bash(jq *),Bash(rm *),Bash(ls *),Bash(mkdir *),Bash(cp *),Bash(mv *),Bash(touch *),Bash(diff *),Bash(cat *),Bash(head *),Bash(tail *),Bash(wc *),Bash(grep *),Bash(echo *),Bash(printf *),Bash(pwd *),Bash(which *),Bash(realpath *),Bash(llvm-* *),Bash(opt *),Bash(llc *),Bash(FileCheck *)"'
            args+=' --disallowedTools "Bash(python3 *),Bash(curl *),Bash(gh api *),Bash(gh pr review *),Bash(gh pr merge *),Bash(gh auth *)"'
            # Pushes and PRs use the claude[bot] token, so CI runs on them.
            args+=' --allowedTools "Bash(gh pr create --draft *),mcp__github_inline_comment__create_inline_comment"'
            args+=' --append-system-prompt "For a review request on a PR, follow .claude/agents/code-review.md: read gh pr diff and the surrounding code, check CI with the mcp__github_ci tools and post specific findings as inline comments. If you fixed an issue on a new branch and your instructions do not forbid opening a PR, push the branch and open a draft PR with gh pr create --draft --base main --head <branch> --title Fix #<issue>: <summary> --body-file <file>. Never open a non-draft PR."'
          fi
          {
            echo "needed=$needed"
            echo "fork=$fork"
            echo "triggered=$triggered"
            echo "args=$args"
          } >> "$GITHUB_OUTPUT"
          echo "Fork PR: $fork, build needed: $needed"

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB below needs bubblewrap and socat;
      # without them every Bash command fails.
      - name: Install subprocess isolation dependencies
        run: |
          echo "APT::Acquire::Retries \"3\";" | sudo tee -a /etc/apt/apt.conf.d/80-retries
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat

      - name: Install build dependencies
        if: steps.build_check.outputs.needed == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build bison flex m4 \
            libc6-dev libc6-dev-i386 g++-multilib \
            libtbb-dev libstdc++6

      - name: Download LLVM
        if: steps.build_check.outputs.needed == 'true'
        run: |
          wget -q --retry-connrefused --waitretry=5 --read-timeout=20 --timeout=15 -t 5 \
            "$LLVM_REPO/releases/download/llvm-$LLVM_VERSION-ispc-dev/$LLVM_TAR"
          tar xf "$LLVM_TAR"
          rm -f "$LLVM_TAR"
          echo "$GITHUB_WORKSPACE/bin-$LLVM_VERSION/bin" >> "$GITHUB_PATH"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        env:
          # Remove secrets such as the Bedrock token from the environment of
          # Claude's commands.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          # Route Claude Code through AWS Bedrock (bearer-token auth)
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
        with:
          use_bedrock: "true"
          # No github_token: the action exchanges the OIDC token for a
          # claude[bot] token, and commits are attributed to claude[bot].
          bot_id: "209825114"
          # track_progress only works with issue/PR events, not workflow_dispatch/workflow_call
          track_progress: ${{ !inputs.prompt && github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call' }}
          # prompt is only used for workflow_dispatch/workflow_call; empty for issue/PR events
          prompt: ${{ inputs.prompt || '' }}
          # Claude can't write $GITHUB_STEP_SUMMARY, so show its report there for prompt runs
          display_report: ${{ inputs.prompt != '' }}
          # Added to the action's default contents, pull_requests and issues
          # write. Without this list the token gets every permission of the
          # Claude App, including workflows write.
          additional_permissions: |
            actions: read
          # Tools and permission mode come from the build check above.
          claude_args: |
            --model us.anthropic.claude-opus-5-5
            ${{ steps.build_check.outputs.args }}

      # If the workflow file differs from the default branch, the token
      # exchange is skipped and the action still succeeds without running
      # Claude. `conclusion` is only set once Claude has run.
      - name: Check that Claude ran
        if: always() && steps.build_check.outputs.triggered == 'true'
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        run: |
          if [ "$CONCLUSION" != success ]; then
            echo "::error::Claude did not complete (conclusion: '${CONCLUSION}')"
            exit 1
          fi
