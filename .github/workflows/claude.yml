name: Claude Code

# To ask for a review of a fork PR, write "@claude review" as a top-level PR
# comment: review and review-comment events from forks run without secrets.
on:
  issue_comment: # zizmor: ignore[dangerous-triggers] - only OWNER/MEMBER/COLLABORATOR comments run the job; fork PRs get a read-only session
    types: [created]
  pull_request_review_comment:
    types: [created]
  # The action only looks for @claude in the issue body and title when the
  # issue is opened; on "assigned" it needs assignee_trigger.
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt for Claude"
        required: true
        type: string
      build:
        description: "Install LLVM and the build dependencies"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      prompt:
        description: "Prompt for Claude"
        required: true
        type: string
      build:
        description: "Install LLVM and the build dependencies"
        required: false
        type: boolean
        default: true
      pr_branch:
        description: "Branch Claude pushes and opens a draft PR from, if not claude/issue-<N>-*"
        required: false
        type: string
        default: ""
      pr_body_file:
        description: "File Claude writes the PR body to; a draft PR opened for pr_branch uses it"
        required: false
        type: string
        default: ""
      pr_title:
        description: "Title of a draft PR opened for pr_branch"
        required: false
        type: string
        default: ""
      llvm_artifact:
        description: "Artifact of the calling run with a CI build of LLVM llvm_version to build with instead of the released LLVM"
        required: false
        type: string
        default: ""
      llvm_version:
        description: "Version of the LLVM in llvm_artifact, such as trunk: its tarball is llvm-<llvm_version>-ubuntu22.04-Release+Asserts-x86.arm.wasm.tar.gz"
        required: false
        type: string
        default: ""
    secrets:
      AWS_REGION:
        required: true
      AWS_BEARER_TOKEN_BEDROCK:
        required: true

permissions: {}

jobs:
  claude:
    # Only run in the main ispc/ispc repo where the secret is available.
    if: |
      github.repository == 'ispc/ispc' &&
      (github.event_name == 'workflow_dispatch' ||
      inputs.prompt != '' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        (github.event.review.author_association == 'OWNER' || github.event.review.author_association == 'MEMBER' || github.event.review.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        (github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER' || github.event.issue.author_association == 'COLLABORATOR')))
    runs-on: ubuntu-22.04
    # Up to ~12 min of setup, one 45-minute command (BASH_MAX_TIMEOUT_MS
    # below) and the rest of the session.
    timeout-minutes: 90
    # One session per issue or PR at a time, so two requests don't race on
    # the same branch; prompt runs group by prompt, which names the issue.
    # queue: max keeps every waiting request.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number || inputs.prompt || github.run_id }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write # Required to push branches and create commits
      pull-requests: write
      issues: write
      actions: read # Required for Claude to read CI results on PRs
      id-token: write # Exchanged for a claude[bot] token
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Code from a fork PR is untrusted: Claude may read and review it, but
      # not edit, build, run or push it. Even read-only git commands can run
      # or write things (`git -c alias.x='!cmd' x`, `git log --output=...`),
      # so fork sessions get no Bash at all and read the diff from a file.
      #
      # Building LLVM + ISPC adds ~2-5 min and ~500MB to the run. Only do it for
      # tasks that actually need to compile: a request mentioning "fix" (e.g.
      # "@claude fix this", "@claude can you fix X"), or a prompt run with
      # "build" set (the default for workflow_call). Lightweight tasks
      # (Q&A, code review) skip the build entirely.
      - name: Determine if build is needed
        id: build_check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROMPT: ${{ inputs.prompt }}
          INPUT_BUILD: ${{ inputs.build }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          IS_PR: ${{ (github.event.issue.pull_request || github.event.pull_request) && 'true' || 'false' }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          fork=false
          if [ "$IS_PR" = true ]; then
            cross=$(gh pr view "$PR_NUMBER" --json isCrossRepository --jq .isCrossRepository)
            # Anything but an explicit "false" counts as a fork.
            [ "$cross" = false ] || fork=true
          fi
          # The text that invoked Claude. Prompt runs (workflow_dispatch and
          # workflow_call) decide with the build input instead; in a called
          # workflow, EVENT_NAME is the caller's event.
          case "$EVENT_NAME" in
            issue_comment|pull_request_review_comment) text=$COMMENT_BODY ;;
            pull_request_review) text=$REVIEW_BODY ;;
            issues) text=$(printf '%s\n%s' "$ISSUE_TITLE" "$ISSUE_BODY") ;;
            *) text= ;;
          esac
          needed=false
          triggered=false
          if [ -n "$INPUT_PROMPT" ]; then
            triggered=true
            if [ "$INPUT_BUILD" = true ]; then needed=true; fi
          else
            # The action's own trigger rule is stricter than the job's if: it
            # wants "@claude" followed by a space, punctuation or the end.
            if printf '%s\n' "$text" | grep -qiE '(^|[[:space:]])@claude([[:space:].,!?;:]|$)'; then
              triggered=true
            fi
            # A mention of "fix" in the invoking text means a build task
            # rather than Q&A/review.
            if printf '%s\n' "$text" | grep -qiE '\bfix(es|ed|ing)?\b'; then
              needed=true
            fi
          fi
          if [ "$fork" = true ]; then
            needed=false
            mkdir -p "$RUNNER_TEMP/pr"
            gh pr diff "$PR_NUMBER" > "$RUNNER_TEMP/pr/pr.diff"
            # The action itself allows git add/commit/rm and its push wrapper;
            # denying Bash removes them too. The action writes its token into
            # .git/config, so Read, Grep and Glob are denied there.
            args='--permission-mode default'
            args+=" --add-dir $RUNNER_TEMP/pr"
            args+=' --allowedTools "Glob,Grep,LS,Read,mcp__github_inline_comment__create_inline_comment"'
            args+=' --disallowedTools "Bash,Edit,MultiEdit,Write,NotebookEdit,WebFetch,WebSearch,Read(./.git/**)"'
            args+=" --append-system-prompt \"This PR comes from a fork, so you can only read and review it. Its diff is in $RUNNER_TEMP/pr/pr.diff. For a review, follow .claude/agents/code-review.md, skipping any step that needs Bash, read the changed code in the checkout, check CI with the mcp__github_ci tools and post specific findings as inline comments. If asked to change, build or test it, reply that a maintainer must push the branch to ispc/ispc first.\""
          else
            # Bash(git *) can still run any program through an alias; the env
            # scrub protects the secrets.
            args='--permission-mode acceptEdits --add-dir /tmp'
            args+=' --allowedTools "Edit,Glob,Grep,LS,Read,Write,Bash(git *),Bash(gh pr view *),Bash(gh pr diff *),Bash(gh pr list *),Bash(gh issue view *),Bash(gh run view *),Bash(gh run list *),Bash(gh run download *),Bash(cmake *),Bash(*cmake *),Bash(clang-format *),Bash(*/ispc *),Bash(./build/*),Bash(build/*),Bash(*run_tests.py *),Bash(jq *),Bash(rm *),Bash(ls *),Bash(mkdir *),Bash(cp *),Bash(mv *),Bash(touch *),Bash(diff *),Bash(cat *),Bash(head *),Bash(tail *),Bash(wc *),Bash(grep *),Bash(echo *),Bash(printf *),Bash(pwd *),Bash(which *),Bash(realpath *),Bash(llvm-* *),Bash(opt *),Bash(llc *),Bash(FileCheck *)"'
            # Pushes and PRs use the claude[bot] token, so CI runs on them.
            args+=' --allowedTools "Bash(gh pr create --draft *),mcp__github_inline_comment__create_inline_comment"'
            # The action's own instructions for issues ask for a "Create a
            # PR" link instead; this overrides them.
            args+=' --append-system-prompt "For a review request on a PR, follow .claude/agents/code-review.md: read gh pr diff and the surrounding code, check CI with the mcp__github_ci tools and post specific findings as inline comments. When you fix an issue (not a change to an existing PR, which you push to its own branch), work on a branch named claude/issue-<issue>-<short-description> (keep the branch the action created, if any) and push it. Then always open a draft PR yourself with gh pr create --draft --base main --head <branch> --title \"Fix #<issue>: <summary>\" --body-file <file>, where the body starts with Fixes #<issue>, and put the PR URL in your reply. This replaces any instruction to provide a Create a PR link. Never open a non-draft PR."'
          fi
          {
            echo "needed=$needed"
            echo "fork=$fork"
            echo "triggered=$triggered"
            echo "args=$args"
          } >> "$GITHUB_OUTPUT"
          echo "Fork PR: $fork, build needed: $needed"

      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB below needs bubblewrap and socat;
      # without them every Bash command fails.
      - name: Install subprocess isolation dependencies
        run: |
          echo "APT::Acquire::Retries \"3\";" | sudo tee -a /etc/apt/apt.conf.d/80-retries
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat

      # An LLVM build the caller uploaded to this run, such as the LLVM trunk
      # build a trunk failure needs.
      - name: Download LLVM
        if: steps.build_check.outputs.needed == 'true' && inputs.llvm_artifact != ''
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ inputs.llvm_artifact }}
          path: ${{ runner.temp }}/llvm

      # The same setup as the CodeQL investigators and the other CI jobs.
      - name: Install build dependencies and LLVM
        if: steps.build_check.outputs.needed == 'true'
        env:
          # Empty means the released LLVM.
          LLVM_TAR: ${{ inputs.llvm_artifact && format('{0}/llvm/llvm-{1}-ubuntu22.04-Release+Asserts-x86.arm.wasm.tar.gz', runner.temp, inputs.llvm_version) || '' }}
          LLVM_VERSION: ${{ inputs.llvm_artifact && inputs.llvm_version || '' }}
        run: |
          # Keep the downloaded files out of Claude's git status and commits.
          printf '%s\n' '/bin-*/' '/sde-external-*/' '/*.tar.xz' '/log[0-9]*.txt' >> .git/info/exclude
          .github/workflows/scripts/install-build-deps.sh

      # Only a push from this run counts for a caller-named PR branch.
      - name: Record the PR branch
        id: pr_branch
        if: inputs.pr_branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ inputs.pr_branch }}
        run: |
          set -o pipefail
          if ! git check-ref-format --branch "$PR_BRANCH" > /dev/null || [[ "$PR_BRANCH" == -* ]]; then
            echo "::error::Invalid pr_branch: $PR_BRANCH"
            exit 1
          fi
          sha=$(git ls-remote origin "refs/heads/$PR_BRANCH" | jq -Rr --arg ref "refs/heads/$PR_BRANCH" 'split("\t") | select(.[1] == $ref) | .[0]')
          echo "before=$sha" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        env:
          # Remove secrets such as the Bedrock token from the environment of
          # Claude's commands.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          # The action ends the session at Claude's first result, and Claude
          # Code then kills background commands. A build Claude starts in the
          # background, or one moved there at its timeout, dies before Claude
          # can commit. Run everything in the foreground, for up to 45 minutes a
          # command; the job timeout leaves room for the setup steps and for
          # pushing afterwards.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          BASH_DEFAULT_TIMEOUT_MS: "2700000"
          BASH_MAX_TIMEOUT_MS: "2700000"
          # Route Claude Code through AWS Bedrock (bearer-token auth)
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
        with:
          use_bedrock: "true"
          # No github_token: the action exchanges the OIDC token for a
          # claude[bot] token, and commits are attributed to claude[bot].
          bot_id: "209825114"
          # track_progress only works with issue/PR events, not workflow_dispatch/workflow_call
          track_progress: ${{ !inputs.prompt && github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call' }}
          # prompt is only used for workflow_dispatch/workflow_call; empty for issue/PR events
          prompt: ${{ inputs.prompt || '' }}
          # Claude can't write $GITHUB_STEP_SUMMARY, so show its report there for prompt runs
          display_report: ${{ inputs.prompt != '' }}
          # Added to the action's default contents, pull_requests and issues
          # write. Without this list the token gets every permission of the
          # Claude App, including workflows write.
          additional_permissions: |
            actions: read
          # Tools and permission mode come from the build check above.
          claude_args: |
            --model us.anthropic.claude-opus-5-5
            ${{ steps.build_check.outputs.args }}

      # If the workflow file differs from the default branch, the token
      # exchange is skipped and the action still succeeds without running
      # Claude. `conclusion` is only set once Claude has run.
      - name: Check that Claude ran
        if: always() && steps.build_check.outputs.triggered == 'true'
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        run: |
          if [ "$CONCLUSION" != success ]; then
            echo "::error::Claude did not complete (conclusion: '${CONCLUSION}')"
            exit 1
          fi

      # Claude should have opened the draft PR itself. Find the branch it
      # pushed, the caller's pr_branch or the requested issue's branch, so we
      # can open a missing PR and verify either path. On a PR, Claude pushes
      # to the PR branch instead.
      - name: Find a pushed fix branch
        id: fix_branch
        # A caller-named branch pushed in this run gets its PR even if Claude
        # failed afterwards.
        if: >-
          !cancelled() &&
          (steps.claude.outputs.conclusion == 'success' ||
           (inputs.pr_branch != '' && steps.pr_branch.outcome == 'success')) &&
          steps.build_check.outputs.fork != 'true' &&
          steps.build_check.outputs.needed == 'true' &&
          !github.event.issue.pull_request && !github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # In a called workflow, github.event is the caller's event.
          EVENT_ISSUE: ${{ !inputs.prompt && github.event.issue.number || '' }}
          INPUT_PROMPT: ${{ inputs.prompt }}
          PR_BRANCH: ${{ inputs.pr_branch }}
          PR_BODY_FILE: ${{ inputs.pr_body_file }}
          BEFORE_SHA: ${{ steps.pr_branch.outputs.before }}
        run: |
          branch=
          needs_pr=false
          mkdir -p "$RUNNER_TEMP/claude-pr"
          if [ -n "$PR_BRANCH" ]; then
            set -o pipefail
            # The caller's branch, if it was pushed in this run as it is here.
            remote=$(git ls-remote origin "refs/heads/$PR_BRANCH" |
              jq -Rr --arg ref "refs/heads/$PR_BRANCH" 'split("\t") | select(.[1] == $ref) | .[0]')
            if [ -n "$remote" ] && [ "$remote" != "$BEFORE_SHA" ]; then
              # Someone else pushed, or Claude pushed another commit than its branch.
              if [ "$remote" != "$(git rev-parse -q --verify "refs/heads/$PR_BRANCH" || true)" ]; then
                echo "::error::$PR_BRANCH changed in this run to $remote, which is not Claude's local branch."
                exit 1
              fi
              branch=$PR_BRANCH
              head=$(jq -rn --arg b "${GH_REPO%%/*}:$branch" '$b | @uri')
              prs=$(gh api "repos/$GH_REPO/pulls?head=$head&state=open" --jq length)
              if [ "$prs" = 0 ]; then
                needs_pr=true
                # The body Claude prepared, if it got that far.
                if [ -n "$PR_BODY_FILE" ] && [ -f "$PR_BODY_FILE" ] && [ ! -L "$PR_BODY_FILE" ] && [ -s "$PR_BODY_FILE" ]; then
                  cp "$PR_BODY_FILE" "$RUNNER_TEMP/claude-pr/body.md"
                else
                  git log --reverse --format='%B' "origin/main..$branch" > "$RUNNER_TEMP/claude-pr/body.md"
                fi
              fi
            fi
          else
            # The issue an @claude comment came from, or those a prompt names.
            if [ -n "$EVENT_ISSUE" ]; then
              requested=" $EVENT_ISSUE "
            else
              requested=" $(printf '%s\n' "$INPUT_PROMPT" | { grep -oE '#[1-9][0-9]*' || true; } | tr -d '#' | tr '\n' ' ') "
            fi
            for b in $(git for-each-ref --format='%(refname:lstrip=2)' 'refs/heads/claude/issue-*'); do
              [[ "$b" =~ ^claude/issue-([1-9][0-9]*)-[A-Za-z0-9._-]+$ ]] || continue
              issue=${BASH_REMATCH[1]}
              [[ "$requested" == *" $issue "* ]] || continue
              [ "$(git rev-list --count "origin/main..$b")" -gt 0 ] || continue
              # Only a branch that was pushed as it is here.
              remote=$(gh api "repos/$GH_REPO/branches/$b" --jq .commit.sha 2>/dev/null || true)
              [ "$remote" = "$(git rev-parse "$b")" ] || continue
              # Any PR from this repository's branch; a fork's same-named
              # branch doesn't count.
              prs=$(gh api "repos/$GH_REPO/pulls?head=${GH_REPO%%/*}:$b&state=all" --jq length)
              if [ -n "$branch" ]; then
                echo "::error::More than one pushed fix branch: $branch, $b"
                exit 1
              fi
              branch=$b
              if [ "$prs" = 0 ]; then
                needs_pr=true
                {
                  echo "Fixes #$issue"
                  echo
                  git log --reverse --format='%B' "origin/main..$b"
                } > "$RUNNER_TEMP/claude-pr/body.md"
              fi
            done
          fi
          if [ -z "$branch" ]; then
            echo "No pushed fix branch."
            exit 0
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "needs_pr=$needs_pr" >> "$GITHUB_OUTPUT"
          if [ "$needs_pr" = true ]; then
            echo "::warning::Claude pushed $branch without opening a PR; opening a draft PR."
          fi

      # Opened by github-actions[bot], so CI doesn't start on it.
      - name: Open a draft PR
        if: ${{ !cancelled() && steps.fix_branch.outputs.needs_pr == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.fix_branch.outputs.branch }}
          PR_TITLE: ${{ inputs.pr_title }}
        run: |
          if [ -n "$PR_TITLE" ]; then
            title=(--title "$PR_TITLE")
          else
            title=(--fill-first)
          fi
          gh pr create --draft --base main --head "$BRANCH" \
            "${title[@]}" --body-file "$RUNNER_TEMP/claude-pr/body.md"
          echo "Opened by github-actions[bot], so CI doesn't start on it; start it manually." >> "$GITHUB_STEP_SUMMARY"

      - name: Check the draft PR
        if: always() && steps.fix_branch.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.fix_branch.outputs.branch }}
        run: |
          pr=$(gh api "repos/$GH_REPO/pulls?head=${GH_REPO%%/*}:$BRANCH&state=open" \
            --jq '[.[] | select(.draft and (.user.login == "claude[bot]" or .user.login == "github-actions[bot]"))][0].number // empty')
          if [ -z "$pr" ]; then
            echo "::error::No open draft PR from claude[bot] or github-actions[bot] for $BRANCH"
            exit 1
          fi
          echo "Draft PR: $GITHUB_SERVER_URL/$GH_REPO/pull/$pr" >> "$GITHUB_STEP_SUMMARY"
