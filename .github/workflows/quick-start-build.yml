name: Quick Start Build

permissions: read-all

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    strategy:
      matrix:
        ubuntu: ['ubuntu-22.04', 'ubuntu-24.04']
    runs-on: ${{ matrix.ubuntu }}
    env:
      ARCHIVE_URL: https://github.com/ispc/ispc.dependencies/releases/download/llvm-23.1-ispc-dev/llvm-23.1.2-ubuntu22.04-Release-x86.arm.wasm.tar.xz

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y git curl cmake xz-utils m4 flex bison python3 libtbb-dev g++-multilib \
          libc6-dev-armhf-cross libc6-dev-arm64-cross

    - name: Build ISPC
      run: ./scripts/quick-start-build.py

  archlinux:
    runs-on: ubuntu-latest
    container:
      image: archlinux@sha256:2fcdd55448255f87dd337ef5c0fdbd5e4fec432345db1aa5faea4bf2764b4ca8
      options: --privileged

    env:
      ARCHIVE_URL: https://github.com/ispc/ispc.dependencies/releases/download/llvm-23.1-ispc-dev/llvm-23.1.2-ubuntu22.04-Release+Asserts-x86.arm.wasm.tar.xz

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install prerequisites
      run: |
        pacman-key --init
        pacman-key --populate archlinux
        # Update keyring first, then re-populate to trust new signing keys
        pacman -Sy --noconfirm archlinux-keyring
        pacman-key --populate archlinux
        pacman -Su --noconfirm
        pacman -S --noconfirm git cmake make gcc-libs glibc lib32-glibc gcc m4 flex bison python onetbb

    - name: Install ARM cross-compilation headers
      shell: bash
      run: |
        pacman -S --noconfirm aarch64-linux-gnu-glibc
        # Arch provides AArch64 headers, but no ARM32 glibc package. Extract Debian's
        # architecture-specific headers into /usr/arm-linux-gnueabihf/include.
        cross_header_dir="$(mktemp -d)"
        cd "$cross_header_dir"
        # Snapshot file URLs keep these packages available across Debian updates.
        curl --fail --location --retry 3 \
          https://snapshot.debian.org/file/5201855e65fce1b89f9deecfd04849e7cea358bc \
          --output libc6-dev-armhf-cross_2.41-11cross1_all.deb
        curl --fail --location --retry 3 \
          https://snapshot.debian.org/file/42675270308252467348a7493d595dc46aa0f500 \
          --output linux-libc-dev-armhf-cross_6.12.38-1cross1_all.deb
        sha256sum --check <<'EOF'
        9f0c3d473edb51883949fb4fd61929110aa3e5d6f4a88782aaa95c9ae65031e0  libc6-dev-armhf-cross_2.41-11cross1_all.deb
        bf6fa2d938e493a84c34086219b3e3e391aba885d4fb349022eda9fdafa36272  linux-libc-dev-armhf-cross_6.12.38-1cross1_all.deb
        EOF
        for cross_header_package in *.deb; do
          bsdtar -xOf "$cross_header_package" data.tar.xz | bsdtar -xf - -C /
        done

    - name: Build ISPC
      run: ./scripts/quick-start-build.py

  macos:
    runs-on: macos-latest
    env:
      ARCHIVE_URL: https://github.com/ispc/ispc.dependencies/releases/download/llvm-23.1-ispc-dev/llvm-23.1.2-macos-Release-universal-x86.arm.wasm.tar.xz

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install prerequisites
      run: |
        brew install bison flex
        echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"
        echo "/opt/homebrew/opt/flex/bin" >> "$GITHUB_PATH"

    - name: Build ISPC
      run: ./scripts/quick-start-build.py

  windows:
    runs-on: windows-latest
    env:
      ARCHIVE_URL: https://github.com/ispc/ispc.dependencies/releases/download/llvm-23.1-ispc-dev/llvm-23.1.2-win.vs2022-Release-x86.arm.wasm.tar.7z

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install prerequisites
      run: |
        Install-ChocoPackage winflexbison3
        Install-ChocoPackage gnuwin32-m4
        pip install py7zr

    - name: Build ISPC
      run: python ./scripts/quick-start-build.py
