name: CodeQL Alert Fixer

# Investigates eligible CodeQL alerts on main, one independent session per alert.
# Fixes are combined on codeql/fixes, and Claude opens a draft PR from it.
# An open PR from codeql/fixes freezes automatic and manual runs.
# Without an open PR, new fixes may be added to the existing branch.
# Delete the branch after merging its PR.

on:
  # zizmor: ignore[dangerous-triggers] - only successful CodeQL scans of main in this repository are used
  workflow_run:
    workflows: [CodeQL]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      alert_number:
        description: Investigate only this alert, even if it waits for a human decision.
        required: false
        type: string

permissions: {}

# One run at a time, so two runs never act on the same alert.
concurrency:
  group: codeql-alert-fixer
  cancel-in-progress: false
  queue: max

jobs:
  select-alerts:
    name: Select alerts
    if: |
      github.repository == 'ispc/ispc' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout, compare commits
      security-events: read
      issues: read
      pull-requests: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      REQUESTED_ALERT: ${{ inputs.alert_number }}
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      base_sha: ${{ steps.select.outputs.base_sha }}
      branch_sha: ${{ steps.select.outputs.branch_sha }}
      covered: ${{ steps.select.outputs.covered }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Select the alerts to investigate
      id: select
      run: .github/workflows/scripts/select-codeql-alerts.sh

  investigate-alerts:
    name: 'Investigate alert #${{ matrix.alert.number }}'
    needs: select-alerts
    if: needs.select-alerts.outputs.matrix != '[]'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        alert: ${{ fromJSON(needs.select-alerts.outputs.matrix) }}
    # Read-only: the agent can't change anything on GitHub.
    permissions:
      contents: read
      security-events: read
    steps:
    - name: Fetch the alert
      env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
        ALERT_NUMBER: ${{ matrix.alert.number }}
      run: |
        mkdir -p "$RUNNER_TEMP/codeql-input" "$RUNNER_TEMP/codeql-result/$ALERT_NUMBER"
        gh api "repos/$GH_REPO/code-scanning/alerts/$ALERT_NUMBER" > "$RUNNER_TEMP/codeql-input/alert.json"

    - name: Check out the selected main commit
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ needs.select-alerts.outputs.base_sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Install build dependencies and LLVM
      run: |
        # Keep the downloaded files out of the agent's git status.
        printf '%s\n' '/bin-*/' '/sde-external-*/' '/*.tar.xz' '/log[0-9]*.txt' >> .git/info/exclude
        .github/workflows/scripts/install-build-deps.sh
        # Needed by CLAUDE_CODE_SUBPROCESS_ENV_SCRUB; without them every Bash command fails.
        sudo apt-get install -y --no-install-recommends bubblewrap socat

    - name: Investigate the alert
      uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
      env:
        # Remove secrets such as the Bedrock token from the environment of
        # Claude's commands, which build and run the proposed fix.
        CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      with:
        use_bedrock: 'true'
        github_token: ${{ github.token }}
        track_progress: false
        prompt: >-
          /investigate-codeql-alert --alert ${{ matrix.alert.number }}
          --analyzed-sha ${{ matrix.alert.analyzed_sha }}
          --base-sha ${{ needs.select-alerts.outputs.base_sha }}
          --input-dir ${{ runner.temp }}/codeql-input
          --result-dir ${{ runner.temp }}/codeql-result/${{ matrix.alert.number }}
        claude_args: |
          --model us.anthropic.claude-opus-5-5
          --add-dir ${{ runner.temp }}/codeql-input
          --add-dir ${{ runner.temp }}/codeql-result
          --add-dir /tmp
          --permission-mode acceptEdits
          --allowedTools "Edit,Glob,Grep,LS,Read,Write,Bash(git *),Bash(cmake *),Bash(*cmake *),Bash(clang-format *),Bash(*/ispc *),Bash(./build/*),Bash(build/*),Bash(*run_tests.py *),Bash(jq *),Bash(ls *),Bash(mkdir *),Bash(cp *),Bash(diff *),Bash(cat *),Bash(head *),Bash(tail *),Bash(wc *),Bash(grep *),Bash(which *),Bash(echo *),Bash(printf *),Bash(llvm-* *),Bash(opt *),Bash(llc *),Bash(FileCheck *)"

    # Only a successful investigation uploads its result, so a failed or
    # timed-out worker never leads to an action. The name omits the run
    # attempt, so a rerun of a later job finds it, and includes the base
    # commit, so a rerun that selects a newer main never reuses it.
    - name: Upload the result
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: codeql-alert-${{ matrix.alert.number }}-${{ github.run_id }}-${{ needs.select-alerts.outputs.base_sha }}
        path: ${{ runner.temp }}/codeql-result
        overwrite: true
        if-no-files-found: error
        retention-days: 14

  collect-results:
    name: Validate results
    needs: [select-alerts, investigate-alerts]
    # Each alert is validated on its own; a failed worker affects only its alert.
    if: ${{ !cancelled() && needs.select-alerts.result == 'success' && needs.select-alerts.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    outputs:
      has_fixes: ${{ steps.validate.outputs.has_fixes }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Download the results of successful investigations
      continue-on-error: true # missing results become incomplete below
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      with:
        pattern: codeql-alert-*-${{ github.run_id }}-${{ needs.select-alerts.outputs.base_sha }}
        merge-multiple: false # Keep each worker's files in its own artifact directory.
        path: results

    - name: Validate each result
      id: validate
      env:
        MATRIX: ${{ needs.select-alerts.outputs.matrix }}
        BASE_SHA: ${{ needs.select-alerts.outputs.base_sha }}
      run: .github/workflows/scripts/validate-codeql-results.sh

    - name: Upload the validated batch
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: codeql-batch-${{ github.run_id }}
        path: batch
        overwrite: true
        if-no-files-found: error
        retention-days: 14

    # Only the reports and patches for the finalizer; the full investigator
    # output stays in the batch artifact for maintainers.
    - name: Upload the reports and patches
      if: steps.validate.outputs.has_fixes == 'true'
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: codeql-patches-${{ github.run_id }}
        path: |
          batch/results.json
          batch/patches
        overwrite: true
        if-no-files-found: error
        retention-days: 14

  finalize:
    name: Push one branch with the validated fixes and open a draft PR
    needs: [select-alerts, collect-results]
    if: ${{ !cancelled() && needs.collect-results.result == 'success' && needs.collect-results.outputs.has_fixes == 'true' }}
    # The permissions claude.yml requests.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    uses: ./.github/workflows/claude.yml
    with:
      prompt: >-
        /finalize-codeql-fixes --run-id ${{ github.run_id }}
        --base-sha ${{ needs.select-alerts.outputs.base_sha }}
        --branch-sha ${{ needs.select-alerts.outputs.branch_sha || 'none' }}
        --covered ${{ needs.select-alerts.outputs.covered }}
      pr_branch: codeql/fixes
      pr_body_file: /tmp/codeql-pr-body.md
      pr_title: Fix CodeQL alerts
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}

  # Claude pushes codeql/fixes itself, so check the pushed branch with
  # trusted code, outside the job Claude ran in. This can't undo a push, but a
  # failure here marks the branch and its PR as not to be merged.
  check-fixes:
    name: Check the pushed fixes branch
    needs: [select-alerts, finalize]
    if: ${{ !cancelled() && needs.finalize.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Check out the selected main commit
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ needs.select-alerts.outputs.base_sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Check codeql/fixes
      env:
        BASE_SHA: ${{ needs.select-alerts.outputs.base_sha }}
        BRANCH_SHA: ${{ needs.select-alerts.outputs.branch_sha }}
      run: .github/workflows/scripts/check-codeql-fixes.sh

  apply-outcomes:
    name: Dismiss false positives and report one Unsure batch
    needs: [select-alerts, collect-results]
    # Independent of the finalize job, so a failed fix branch doesn't hold back these outcomes.
    if: ${{ !cancelled() && needs.collect-results.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout, compare commits
      issues: write
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Download the validated batch
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      with:
        name: codeql-batch-${{ github.run_id }}
        path: batch

    - name: Apply the outcomes
      env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        BASE_SHA: ${{ needs.select-alerts.outputs.base_sha }}
      run: .github/workflows/scripts/apply-codeql-outcomes.sh
