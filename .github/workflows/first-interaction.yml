name: First-Time Contributor Welcome

on:
  # pull_request_target is required so the action has a token that can comment
  # on PRs from forks. This is safe here because the workflow checks out NO PR
  # code and executes nothing from the fork - it only posts a comment via the
  # GitHub API. Do NOT add a checkout of the PR head or run fork scripts here.
  pull_request_target: # zizmor: ignore[dangerous-triggers] - no fork code is checked out or executed; comment-only
    types: [opened]

permissions: {}

jobs:
  welcome:
    # Only run in the main ispc/ispc repo.
    if: github.repository == 'ispc/ispc'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      # first-interaction's isFirstIssue() check queries the issues API; without
      # issues:read the token can't see the author's issues and treats everyone
      # as a first-timer.
      issues: read

    steps:
      - name: Greet first-time contributors
        # Only greet genuine newcomers. Gating positively on author_association
        # avoids first-interaction's isFirstIssue quirk (which welcomes anyone
        # who has never opened a plain issue, including prolific PR authors and
        # bots) and does not depend on MEMBER being visible for private org
        # members (who appear as CONTRIBUTOR/NONE in the webhook context).
        if: >-
          github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' ||
          github.event.pull_request.author_association == 'NONE'
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          # issue_message is required by the action even though this workflow
          # only triggers on pull_request_target; new issues are handled by
          # issue-auto-ack.yml, so this message is never actually posted.
          issue_message: >-
            Thanks for filing your first issue, and welcome to ISPC!
            A maintainer will triage it soon.
          pr_message: >-
            Thanks for opening your first pull request, and welcome to ISPC! 🎉
            A maintainer will review your changes soon.

            To help the review go smoothly, please make sure you've read
            [CONTRIBUTING](https://github.com/ispc/ispc/blob/main/CONTRIBUTING.md),
            formatted any C/C++ changes with `clang-format`, and that the test
            suite passes. We appreciate your contribution!
